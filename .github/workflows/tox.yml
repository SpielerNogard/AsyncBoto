name: tox

on:
  pull_request:
    branches:
      - main

jobs:
  get-tox-envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.get-envs.outputs.envs }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Get tox environments
      id: get-envs
      run: echo "envs=$(tox --listenvs | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT

  tox:
    needs: get-tox-envs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(needs.get-tox-envs.outputs.envs) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: "${{ secrets.GITHUB_TOKEN }}"
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python3.12 -m pip install --upgrade pip
        pip install tox

    - name: Run tests
      run: tox -e ${{ matrix.env }}